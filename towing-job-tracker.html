<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tow Log</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --asphalt:#191c1f;
    --asphalt-2:#22262a;
    --steel:#2c3136;
    --amber:#f5a623;
    --amber-dim:#c9861a;
    --safety-red:#e2503a;
    --paper:#f4f2ee;
    --paper-dim:#c9c6c0;
    --line:#3a3f45;
    --good:#5fb87a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--asphalt);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:960px;margin:0 auto;padding:0 20px 80px;}

  /* Header */
  header{
    background:
      repeating-linear-gradient(135deg, transparent 0 18px, rgba(245,166,35,0.06) 18px 36px),
      var(--asphalt-2);
    border-bottom:4px solid var(--amber);
    padding:36px 20px 26px;
    margin-bottom:32px;
  }
  header .inner{max-width:960px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;}
  .eyebrow{font-family:'Oswald',sans-serif;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--amber);margin:0 0 6px;}
  h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:34px;margin:0;letter-spacing:.01em;text-transform:uppercase;}
  .stats{display:flex;gap:26px;}
  .stat{text-align:right;}
  .stat .n{font-family:'Oswald',sans-serif;font-size:26px;font-weight:600;color:var(--amber);line-height:1;}
  .stat .l{font-size:11px;color:var(--paper-dim);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;}

  /* Card */
  .card{background:var(--asphalt-2);border:1px solid var(--line);border-radius:8px;padding:24px;margin-bottom:24px;}
  .card h2{font-family:'Oswald',sans-serif;font-size:16px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 18px;color:var(--paper);border-left:4px solid var(--amber);padding-left:10px;}

  form{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.span2{grid-column:span 2;}
  .field.span4{grid-column:span 4;}
  label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--paper-dim);}
  input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{
    background:var(--steel);border:1px solid var(--line);border-radius:5px;color:var(--paper);
    padding:10px 11px;font-size:14px;font-family:'Inter',sans-serif;width:100%;
  }
  textarea{resize:vertical;min-height:44px;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber);}
  .toggle-row{display:flex;gap:8px;}
  .toggle-btn{flex:1;padding:10px;border-radius:5px;border:1px solid var(--line);background:var(--steel);color:var(--paper-dim);cursor:pointer;font-size:13px;font-weight:600;text-align:center;}
  .toggle-btn.active{background:var(--amber);color:var(--asphalt);border-color:var(--amber);}

  .calc-strip{grid-column:span 4;display:flex;justify-content:flex-end;gap:24px;padding-top:8px;border-top:1px dashed var(--line);margin-top:6px;}
  .calc-strip .item{text-align:right;}
  .calc-strip .item .v{font-family:'Oswald',sans-serif;font-size:20px;color:var(--amber);}
  .calc-strip .item .k{font-size:11px;color:var(--paper-dim);text-transform:uppercase;}

  .actions{grid-column:span 4;display:flex;justify-content:flex-end;gap:10px;margin-top:4px;}
  button.primary{background:var(--amber);color:var(--asphalt);border:none;padding:12px 22px;border-radius:5px;font-weight:700;font-size:14px;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;}
  button.primary:hover{background:#ffb840;}
  button.secondary{background:transparent;color:var(--paper-dim);border:1px solid var(--line);padding:12px 18px;border-radius:5px;font-weight:600;font-size:14px;cursor:pointer;}
  button.secondary:hover{color:var(--paper);border-color:var(--paper-dim);}

  /* Table */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:left;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:11px;color:var(--paper-dim);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap;}
  tbody td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;}
  tbody tr:hover{background:rgba(245,166,35,0.05);}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;}
  .pill.member{background:rgba(95,184,122,0.15);color:var(--good);}
  .pill.nonmember{background:rgba(226,80,58,0.15);color:var(--safety-red);}
  .rowtotal{color:var(--amber);font-weight:700;font-family:'Oswald',sans-serif;}
  .del-btn{background:none;border:none;color:var(--paper-dim);cursor:pointer;font-size:16px;line-height:1;}
  .del-btn:hover{color:var(--safety-red);}
  .empty{padding:40px 10px;text-align:center;color:var(--paper-dim);font-size:14px;}
  .notes-cell{max-width:160px;color:var(--paper-dim);font-size:12.5px;}

  @media(max-width:720px){
    form{grid-template-columns:repeat(2,1fr);}
    .field.span2,.field.span4{grid-column:span 2;}
    .calc-strip{grid-column:span 2;justify-content:space-between;}
    .actions{grid-column:span 2;}
    .stats{gap:16px;}
    table{display:block;overflow-x:auto;}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;} }
</style>
</head>
<body>
<header>
  <div class="inner">
    <div>
      <p class="eyebrow">Roadside &amp; Recovery</p>
      <h1>Tow Job Log</h1>
    </div>
    <div class="stats">
      <div class="stat"><div class="n" id="statCount">0</div><div class="l">Jobs</div></div>
      <div class="stat"><div class="n" id="statMiles">0</div><div class="l">Total Miles</div></div>
      <div class="stat"><div class="n" id="statCash">$0</div><div class="l">Collected</div></div>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="card">
    <h2>New Job</h2>
    <form id="jobForm">
      <div class="field">
        <label>Date</label>
        <input type="date" id="f_date" required>
      </div>
      <div class="field">
        <label>Time</label>
        <input type="time" id="f_time">
      </div>
      <div class="field span2">
        <label>Customer Name</label>
        <input type="text" id="f_name" placeholder="Jane Doe">
      </div>

      <div class="field span2">
        <label>Membership</label>
        <div class="toggle-row">
          <div class="toggle-btn active" data-val="member" id="btnMember">Member</div>
          <div class="toggle-btn" data-val="nonmember" id="btnNonmember">Non-Member</div>
        </div>
      </div>
      <div class="field span2">
        <label>Membership #</label>
        <input type="text" id="f_membernum" placeholder="e.g. AAA-00000000">
      </div>

      <div class="field">
        <label>En Route Miles</label>
        <input type="number" id="f_enroute" min="0" step="0.1" value="0">
      </div>
      <div class="field">
        <label>Tow Miles</label>
        <input type="number" id="f_towmiles" min="0" step="0.1" value="0">
      </div>
      <div class="field">
        <label>Tolls ($)</label>
        <input type="number" id="f_tolls" min="0" step="0.01" value="0">
      </div>
      <div class="field">
        <label>Out-of-Pocket ($)</label>
        <input type="number" id="f_oop" min="0" step="0.01" value="0">
      </div>

      <div class="field span2">
        <label>Additional Charge Description</label>
        <input type="text" id="f_addldesc" placeholder="Winch out, dolly, extra labor...">
      </div>
      <div class="field span2">
        <label>Additional Charges ($)</label>
        <input type="number" id="f_addl" min="0" step="0.01" value="0">
      </div>

      <div class="field span4">
        <label>Notes</label>
        <textarea id="f_notes" placeholder="Pickup / drop-off locations, vehicle info, anything else worth remembering"></textarea>
      </div>

      <div class="calc-strip">
        <div class="item"><div class="v" id="calcMiles">0</div><div class="k">Total Miles</div></div>
        <div class="item"><div class="v" id="calcTotal">$0.00</div><div class="k">Total Collected</div></div>
      </div>

      <div class="actions">
        <button type="button" class="secondary" id="resetBtn">Clear</button>
        <button type="submit" class="primary">Log Job</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h2>Job History</h2>
    <div id="tableWrap">
      <div class="empty">Loading...</div>
    </div>
  </div>

</div>

<script>
const STORAGE_KEY = 'tow-jobs';
let jobs = [];
let membership = 'member';

const $ = id => document.getElementById(id);

function fmtMoney(n){ return '$' + (Math.round(n*100)/100).toFixed(2); }
function fmtMiles(n){ return (Math.round(n*10)/10).toString(); }

function recalcStrip(){
  const en = parseFloat($('f_enroute').value)||0;
  const tow = parseFloat($('f_towmiles').value)||0;
  const tolls = parseFloat($('f_tolls').value)||0;
  const oop = parseFloat($('f_oop').value)||0;
  const addl = parseFloat($('f_addl').value)||0;
  $('calcMiles').textContent = fmtMiles(en+tow);
  $('calcTotal').textContent = fmtMoney(tolls+oop+addl);
}

['f_enroute','f_towmiles','f_tolls','f_oop','f_addl'].forEach(id=>{
  $(id).addEventListener('input', recalcStrip);
});

$('btnMember').addEventListener('click', ()=>{
  membership='member';
  $('btnMember').classList.add('active');
  $('btnNonmember').classList.remove('active');
});
$('btnNonmember').addEventListener('click', ()=>{
  membership='nonmember';
  $('btnNonmember').classList.add('active');
  $('btnMember').classList.remove('active');
});

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
$('f_date').value = todayStr();

$('resetBtn').addEventListener('click', ()=>{
  $('jobForm').reset();
  $('f_date').value = todayStr();
  membership='member';
  $('btnMember').classList.add('active');
  $('btnNonmember').classList.remove('active');
  recalcStrip();
});

async function loadJobs(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    jobs = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    jobs = [];
  }
  render();
}

async function saveJobs(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(jobs), false);
  }catch(e){
    console.error('Storage error', e);
    alert('Could not save. Your job list may not persist.');
  }
}

function render(){
  const wrap = $('tableWrap');
  if(!jobs.length){
    wrap.innerHTML = '<div class="empty">No jobs logged yet. Fill out the form above to add your first one.</div>';
  } else {
    const sorted = [...jobs].sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));
    let rows = sorted.map(j=>{
      const total = (j.tolls||0)+(j.oop||0)+(j.addl||0);
      const miles = (j.enroute||0)+(j.towmiles||0);
      return `<tr>
        <td>${j.date}${j.time ? ' '+j.time : ''}</td>
        <td>${j.name || '—'}</td>
        <td><span class="pill ${j.membership==='member'?'member':'nonmember'}">${j.membership==='member'?'Member':'Non-Member'}</span>${j.membernum ? '<div class="notes-cell">'+escapeHtml(j.membernum)+'</div>' : ''}</td>
        <td>${fmtMiles(j.enroute||0)}</td>
        <td>${fmtMiles(j.towmiles||0)}</td>
        <td>${fmtMiles(miles)}</td>
        <td>${fmtMoney(j.tolls||0)}</td>
        <td>${fmtMoney(j.oop||0)}</td>
        <td>${fmtMoney(j.addl||0)}${j.addldesc ? '<div class="notes-cell">'+escapeHtml(j.addldesc)+'</div>' : ''}</td>
        <td class="rowtotal">${fmtMoney(total)}</td>
        <td class="notes-cell">${escapeHtml(j.notes||'')}</td>
        <td><button class="del-btn" data-id="${j.id}" title="Delete">✕</button></td>
      </tr>`;
    }).join('');
    wrap.innerHTML = `<table>
      <thead><tr>
        <th>Date</th><th>Customer</th><th>Status</th><th>En Route</th><th>Tow</th><th>Total Mi</th>
        <th>Tolls</th><th>Out-of-Pocket</th><th>Additional</th><th>Job Total</th><th>Notes</th><th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
    wrap.querySelectorAll('.del-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.getAttribute('data-id');
        if(confirm('Delete this job entry?')){
          jobs = jobs.filter(j=>j.id!==id);
          await saveJobs();
          render();
        }
      });
    });
  }
  updateStats();
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function updateStats(){
  const count = jobs.length;
  const miles = jobs.reduce((a,j)=>a+(j.enroute||0)+(j.towmiles||0),0);
  const cash = jobs.reduce((a,j)=>a+(j.tolls||0)+(j.oop||0)+(j.addl||0),0);
  $('statCount').textContent = count;
  $('statMiles').textContent = fmtMiles(miles);
  $('statCash').textContent = fmtMoney(cash).replace('.00','');
}

$('jobForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const job = {
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    date: $('f_date').value || todayStr(),
    time: $('f_time').value,
    name: $('f_name').value.trim(),
    membership: membership,
    membernum: $('f_membernum').value.trim(),
    enroute: parseFloat($('f_enroute').value)||0,
    towmiles: parseFloat($('f_towmiles').value)||0,
    tolls: parseFloat($('f_tolls').value)||0,
    oop: parseFloat($('f_oop').value)||0,
    addldesc: $('f_addldesc').value.trim(),
    addl: parseFloat($('f_addl').value)||0,
    notes: $('f_notes').value.trim()
  };
  jobs.push(job);
  await saveJobs();
  $('jobForm').reset();
  $('f_date').value = todayStr();
  membership='member';
  $('btnMember').classList.add('active');
  $('btnNonmember').classList.remove('active');
  recalcStrip();
  render();
});

recalcStrip();
loadJobs();
</script>
</body>
</html>
